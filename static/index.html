<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Radar</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        
        <!-- pre-made tags that are cloned for each task element -->
        <div id="tag-templates" style="display: none">
            <span class="tag high">high</span>
            <span class="tag normal">normal</span>
            <span class="tag low">low</span>
            <span class="tag in-progress">in progress</span>
            <span class="tag complete">complete</span>
            <span class="tag not-started">not started</span>
        </div>

        <div id="tasks-grid">
            <!--<div class="task">
                <p class="title">Do some thing title goes here</p>
                <p class="desc">These are the details necessary to complete the task</p>
                <span class="tag high">high</span>
                <span class="tag normal">normal</span>
                <span class="tag low">low</span>
                <span class="tag in-progress">in progress</span>
                <span class="tag complete">complete</span>
                <span class="tag not-started">not started</span>
            </div>-->
        </div>
        <dialog id="edit-task" closedby="any">
            <form id="edit-task-form">
                <input type="text" id="task-title" placeholder="Task title..." required>
                <textarea id="task-desc" placeholder="Description (optional)..."></textarea>
                <p>
                    <span>Priority:</span>
                    <input type="radio" id="task-low" name="priority" checked> <label for="task-low" class="tag low">low</label>
                    <input type="radio" id="task-normal" name="priority" checked> <label for="task-normal" class="tag normal">normal</label>
                    <input type="radio" id="task-high" name="priority"> <label for="task-high" class="tag high">high</label>
                </p>
                <p>
                    <span>Status:</span>
                    <input type="radio" id="task-not-started" name="status" checked> <label for="task-not-started" class="tag not-started">not started</label>
                    <input type="radio" id="task-in-progress" name="status"> <label for="task-in-progress" class="tag in-progress">in progress</label>
                    <input type="radio" id="task-complete" name="status"> <label for="task-complete" class="tag complete">complete</label>
                </p>
                <label for="task-date">Due date:</label> <input type="date" id="task-date">
                <button type="submit">Save</button>
            </form>
        </dialog>
        <button id="new-task-button">&#65291;</button>
        <script src="radar.js"></script>
    </body>
</html>
